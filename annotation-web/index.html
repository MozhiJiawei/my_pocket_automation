<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据标注管道</title><link rel="stylesheet" id="annotation-style" href="/style.css?v=puzzle-20261013"></head>
<body><header><div><small>口袋自动化 / 数据标注管道</small><h1 id="heading">正在加载队列</h1></div><div class="badge">队列文件交接</div></header>
<main><aside><div class="buttons"><button id="pending">未完成 <span id="pending-count">0</span></button><button id="confirmed">已完成 <span id="confirmed-count">0</span></button></div><label>类别<select id="category" aria-label="类别"></select></label><label>输入轮次<select id="round" aria-label="输入轮次"></select></label><p id="progress" class="hint"></p><h2>这一项的答案</h2><p id="instructions">请选出整轮所有正确物品。确认成功后自动进入当前类别下一项。</p><div id="item-legend" class="legend"><i class="red"></i>是 <i class="gray"></i>否</div><p class="hint" id="advice">AI 建议作为初始选择，点击物品可反转。</p>
<div class="buttons"><button id="undo">撤销</button><button id="puzzle-reset" hidden>恢复原图顺序</button></div><div class="metric"><strong id="count">0</strong><span id="count-label">个“是”</span></div>
<h2>查看方式</h2><label><span id="view-label">画面</span><select id="view"><option value="strip">整轮长图 · 去重</option></select></label><label>显示宽度<input id="zoom" type="range" min="350" max="1100" value="680" step="10"></label><p class="hint" id="interaction-hint">直接点击物品切换“是／否”。确认后归档并自动下一项；未完成编辑仅在当前页面保留。</p>
<footer><button id="save" class="primary">确认并下一项</button><button id="skip">暂跳过</button><button id="refresh">刷新队列</button><div id="status" role="status" aria-live="polite">正在加载…</div></footer></aside>
<article><section id="references"><h2 id="reference-heading">当前题目的图标参考</h2><p id="reference-note" class="hint"></p><div id="reference-icons"></div><details><summary>AI 判断依据与待核对项</summary><p id="proposal-note" class="hint"></p></details></section><div class="canvas-title"><span id="title">整轮长图</span><span id="source">坐标以原图为准</span></div><div id="stage"><img id="picture" alt="寻物的完整候选画面"><svg id="overlay" aria-label="标注区域"></svg></div>
<section id="puzzle-workspace" hidden aria-label="拼图标注工作区">
  <div class="puzzle-card"><div class="puzzle-card-title"><h2>还原后的图案</h2><span id="puzzle-page-state" class="hint"></span></div><p class="hint">拖到另一格，交换两块的位置。拼接边缘应自然连贯。</p><div id="puzzle-board"><svg id="puzzle-canvas" role="group" aria-label="拖动图块还原拼图" tabindex="-1"></svg></div>
    <div class="puzzle-options"><label><input id="puzzle-labels" type="checkbox" checked>显示原图块编号</label><label><input id="puzzle-reviewed" type="checkbox">本张已还原</label></div><p id="puzzle-order" class="hint"></p><p class="hint">也可用键盘：空格选块，方向键移到另一格，空格交换；Esc 取消。</p>
  </div>
  <div class="puzzle-card puzzle-original"><h2>采集原图</h2><p class="hint">编号跟随原图块；拖动不会改变原图。</p><div id="puzzle-source"><img id="puzzle-original-image" alt="拼图采集原图"><svg id="puzzle-original-labels" aria-hidden="true"></svg></div></div>
</section></article></main><script src="/puzzle.js?v=puzzle-20261013"></script><script src="/app.js?v=puzzle-20261013"></script></body></html>
