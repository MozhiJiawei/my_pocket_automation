<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据标注管道</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><small>口袋自动化 / 数据标注管道</small><h1 id="heading">正在加载队列</h1></div><div class="badge">队列文件交接</div></header>
<main><aside><div class="buttons"><button id="pending">未完成 <span id="pending-count">0</span></button><button id="confirmed">已完成 <span id="confirmed-count">0</span></button></div><div id="archive-list"></div><p id="progress" class="hint"></p><h2>这一项的答案</h2><p>请选出整轮所有正确物品。确认成功后自动进入下一项。</p><div class="legend"><i class="green"></i>是 <i class="gray"></i>否</div><p class="hint" id="advice">AI 建议作为初始选择，点击物品可反转。</p>
<div class="buttons"><button id="undo">撤销</button></div><div class="metric"><strong id="count">0</strong><span>个“是”</span></div>
<h2>查看方式</h2><label>画面<select id="view"><option value="strip">整轮长图 · 去重</option></select></label><label>显示宽度<input id="zoom" type="range" min="350" max="1100" value="680" step="10"></label><p class="hint">直接点击物品切换“是／否”。确认后归档并自动下一项；未完成编辑仅在当前页面保留。</p>
<footer><button id="save" class="primary">确认并下一项</button><button id="skip">暂跳过</button><button id="refresh">刷新队列</button><div id="status" role="status" aria-live="polite">正在加载…</div></footer></aside>
<article><div class="canvas-title"><span id="title">整轮长图</span><span id="source">坐标以原图为准</span></div><div id="stage"><img id="picture" alt="寻物的完整候选画面"><svg id="overlay" aria-label="标注区域"></svg></div></article></main><script src="/app.js"></script></body></html>
